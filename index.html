<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Date Sorter</title>
<style>
body{font-family:system-ui,sans-serif;max-width:640px;margin:0 auto;padding:12px}
#banner{padding:8px;border-radius:6px;font-weight:600;margin-bottom:10px}
.pass{background:#cfe;color:#063}.fail{background:#fcc;color:#800}
textarea{width:100%;box-sizing:border-box;height:120px;font:inherit}
button{padding:8px 14px;margin:8px 0;font:inherit}
li.bad{color:#a00}
details pre{white-space:pre-wrap;font-size:12px}
</style></head><body>
<script data-bean-store>(function(){if(typeof location!=='undefined'&&location&&location.protocol==='about:'&&typeof document!=='undefined'&&document.addEventListener){document.addEventListener('click',function(e){var a=e.target&&e.target.closest&&e.target.closest('a[href^="#"]');if(!a||a.target==='_blank')return;e.preventDefault();try{location.hash=a.getAttribute('href')}catch(x){}},true)}if(typeof window==='undefined')return;try{window.localStorage.getItem('x');return}catch(e){}var d=Object.assign({},window.__BEAN_SAVED||{});function post(){try{parent.postMessage({type:'bean-store',data:d},'*')}catch(e){}}var ls={getItem:function(k){return Object.prototype.hasOwnProperty.call(d,k)?d[k]:null},setItem:function(k,v){d[k]=String(v);post()},removeItem:function(k){delete d[k];post()},clear:function(){d={};post()},key:function(i){return Object.keys(d)[i]||null}};Object.defineProperty(ls,'length',{get:function(){return Object.keys(d).length}});try{Object.defineProperty(window,'localStorage',{value:ls,configurable:true})}catch(e){}})();</script>
<h1>Date Sorter</h1>
<div id="banner"></div>
<p>One date per line, like 2024-3-9 or 2024-02-29. Impossible dates are rejected, not sorted.</p>
<textarea id="in">2024-2-30
2024-2-29
2023-12-1
2023-2-29
2100-2-29
2000-2-29
2024-4-31
2024-01-05</textarea>
<button id="go">Sort</button>
<h2>Sorted</h2><ol id="ok"></ol>
<h2>Rejected</h2><ul id="bad"></ul>
<details><summary>Self-test details</summary><pre id="log"></pre></details>
<script>
function isLeap(y){return (y%4===0&&y%100!==0)||y%400===0;}
function daysIn(y,m){return [31,isLeap(y)?29:28,31,30,31,30,31,31,30,31,30,31][m-1];}
function parseDate(s){
  var m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(s).trim());
  return m?{y:+m[1],m:+m[2],d:+m[3]}:null;
}
function isRealDate(s){
  var p=parseDate(s);
  if(!p||p.m<1||p.m>12||p.d<1)return false;
  return p.d<=daysIn(p.y,p.m);
}
// broken twin: every month has 31 days
function isRealDateBroken(s){
  var p=parseDate(s);
  if(!p||p.m<1||p.m>12||p.d<1)return false;
  return p.d<=31;
}
function key(s){var p=parseDate(s);return p.y*10000+p.m*100+p.d;}
function sortDates(lines,check){
  var ok=[],bad=[];
  lines.map(function(l){return l.trim();}).filter(Boolean).forEach(function(l){(check(l)?ok:bad).push(l);});
  ok.sort(function(a,b){return key(a)-key(b);});
  return {ok:ok,bad:bad};
}
var cases=[
 ['2024-2-30',false],['2024-2-29',true],['2024-02-31',false],
 ['2023-2-29',false],['2023-2-28',true],
 ['1900-2-29',false],['2000-2-29',true],['2100-2-29',false],['2400-2-29',true],
 ['2024-4-31',false],['2024-4-30',true],['2024-13-1',false],['2024-0-5',false],['2024-1-0',false],['2024-12-31',true],['abc',false]
];
function runTests(){
  var out=[],allPass=true;
  cases.forEach(function(c){
    var r=isRealDate(c[0])===c[1];if(!r)allPass=false;
    out.push((r?'ok   ':'FAIL ')+c[0]+' -> '+c[1]);
  });
  var s=sortDates(['2024-3-1','2023-12-5','2024-2-30','2024-2-29'],isRealDate);
  var sr=s.ok.join()==='2023-12-5,2024-2-29,2024-3-1'&&s.bad.join()==='2024-2-30';
  if(!sr)allPass=false;out.push((sr?'ok   ':'FAIL ')+'sort drops 2024-2-30');
  // broken twin must fail the Feb 30 and Feb 29 (non-leap) boundaries
  var caught=['2024-2-30','2023-2-29','1900-2-29'].every(function(d){return isRealDateBroken(d)!==false;});
  var twinFails=cases.some(function(c){return isRealDateBroken(c[0])!==c[1];});
  var feb30=isRealDateBroken('2024-2-30')!==false;
  var okTwin=twinFails&&feb30&&caught;
  if(!okTwin)allPass=false;
  out.push((okTwin?'ok   ':'FAIL ')+'broken copy fails Feb 29/30 boundaries');
  return {pass:allPass,log:out};
}
var t=runTests(),b=document.getElementById('banner');
b.className=t.pass?'pass':'fail';
b.textContent=t.pass?'Self-test: all '+(cases.length+2)+' checks pass (leap years included)':'Self-test FAILED';
document.getElementById('log').textContent=t.log.join('\n');
function render(){
  var r=sortDates(document.getElementById('in').value.split('\n'),isRealDate);
  document.getElementById('ok').innerHTML=r.ok.map(function(x){return '<li>'+x+'</li>';}).join('');
  document.getElementById('bad').innerHTML=r.bad.map(function(x){return '<li class="bad">'+x.replace(/</g,'&lt;')+' (not a real date)</li>';}).join('');
}
document.getElementById('go').addEventListener('click',render);
render();
</script></body></html>
