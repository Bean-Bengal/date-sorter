<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Date Sorter</title>
<style>
body{font-family:system-ui,sans-serif;max-width:640px;margin:0 auto;padding:12px}
#banner{padding:8px;border-radius:6px;font-weight:600;margin-bottom:10px}
.pass{background:#cfe;color:#063}.fail{background:#fcc;color:#800}
textarea{width:100%;box-sizing:border-box;height:120px;font:inherit}
button{padding:8px 14px;margin:8px 0;font:inherit}
li.bad{color:#a00}
details pre{white-space:pre-wrap;font-size:12px}
#checks{padding:8px 8px 8px 24px;border:1px solid #888;border-radius:6px;margin:8px 0;font-size:14px}
#checks li{margin:4px 0}
</style></head><body>
<script data-bean-store>(function(){if(typeof location!=='undefined'&&location&&location.protocol==='about:'&&typeof document!=='undefined'&&document.addEventListener){document.addEventListener('click',function(e){var a=e.target&&e.target.closest&&e.target.closest('a[href^="#"]');if(!a||a.target==='_blank')return;e.preventDefault();try{location.hash=a.getAttribute('href')}catch(x){}},true)}if(typeof window==='undefined')return;try{window.localStorage.getItem('x');return}catch(e){}var d=Object.assign({},window.__BEAN_SAVED||{});function post(){try{parent.postMessage({type:'bean-store',data:d},'*')}catch(e){}}var ls={getItem:function(k){return Object.prototype.hasOwnProperty.call(d,k)?d[k]:null},setItem:function(k,v){d[k]=String(v);post()},removeItem:function(k){delete d[k];post()},clear:function(){d={};post()},key:function(i){return Object.keys(d)[i]||null}};Object.defineProperty(ls,'length',{get:function(){return Object.keys(d).length}});try{Object.defineProperty(window,'localStorage',{value:ls,configurable:true})}catch(e){}})();</script>
<h1>Date Sorter</h1>
<div id="banner"></div>
<p>One date per line, like 2024-3-9 or 2024-02-29. Impossible dates are rejected, not sorted.</p>
<textarea id="in">2024-2-30
2024-2-29
2023-12-1
2023-2-29
2100-2-29
2000-2-29
2024-4-31
2024-01-05</textarea>
<button id="go">Sort</button>
<h2>Sorted</h2><ol id="ok"></ol>
<h2>Rejected</h2><ul id="bad"></ul>
<h2>Checks</h2>
<ul id="checks"></ul>
<details><summary>Self-test details</summary><pre id="log"></pre></details>
<script>
function isLeap(y){return (y%4===0&&y%100!==0)||y%400===0;}
function daysInWith(leapFn,y,m){return [31,leapFn(y)?29:28,31,30,31,30,31,31,30,31,30,31][m-1];}
function daysIn(y,m){return daysInWith(isLeap,y,m);}
function parseDate(s){
  var m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(s).trim());
  return m?{y:+m[1],m:+m[2],d:+m[3]}:null;
}
function isRealDate(s){
  var p=parseDate(s);
  if(!p||p.m<1||p.m>12||p.d<1)return false;
  return p.d<=daysIn(p.y,p.m);
}
// broken twin: every month has 31 days
function isRealDateBroken(s){
  var p=parseDate(s);
  if(!p||p.m<1||p.m>12||p.d<1)return false;
  return p.d<=31;
}
// broken twin: every year is a leap year
function isRealDateAlwaysLeap(s){
  var p=parseDate(s);
  if(!p||p.m<1||p.m>12||p.d<1)return false;
  return p.d<=daysInWith(function(){return true;},p.y,p.m);
}
function leapTest(check){
  return check('2024-2-29')===true&&check('2023-2-29')===false;
}
function monthTest(check){
  return check('2024-4-31')===false&&check('2024-2-30')===false&&check('2024-4-30')===true&&check('2024-2-29')===true;
}
var badDates=['2024-6-31','2024-9-31','2023-11-31','2024-2-0','2024-0-10','2024-13-10','2024-1-32','2024-2-3x','12024-1-1','','2024/1/1','2024-1'];
function badTest(check){
  return badDates.every(function(d){return check(d)===false;})&&check('2024-6-30')===true&&check('2024-1-31')===true;
}
function key(s){var p=parseDate(s);return p.y*10000+p.m*100+p.d;}
function sortDates(lines,check){
  var ok=[],bad=[];
  lines.map(function(l){return l.trim();}).filter(Boolean).forEach(function(l){(check(l)?ok:bad).push(l);});
  ok.sort(function(a,b){return key(a)-key(b);});
  return {ok:ok,bad:bad};
}
var cases=[
 ['2024-2-30',false],['2024-2-29',true],['2024-02-31',false],
 ['2023-2-29',false],['2023-2-28',true],
 ['1900-2-29',false],['2000-2-29',true],['2100-2-29',false],['2400-2-29',true],
 ['2024-4-31',false],['2024-4-30',true],['2024-13-1',false],['2024-0-5',false],['2024-1-0',false],['2024-12-31',true],['abc',false]
];
function runTests(){
  var out=[],allPass=true,n=0;
  function rec(r,msg){if(!r)allPass=false;n++;out.push((r?'ok   ':'FAIL ')+msg);}
  cases.forEach(function(c){rec(isRealDate(c[0])===c[1],c[0]+' -> '+c[1]);});
  var s=sortDates(['2024-3-1','2023-12-5','2024-2-30','2024-2-29'],isRealDate);
  rec(s.ok.join()==='2023-12-5,2024-2-29,2024-3-1'&&s.bad.join()==='2024-2-30','sort drops 2024-2-30');
  var twinFails=cases.some(function(c){return isRealDateBroken(c[0])!==c[1];});
  var bs=sortDates(['2024-3-1','2024-2-30','2024-2-29'],isRealDateBroken);
  rec(twinFails&&isRealDateBroken('2024-2-30')===true&&bs.ok.indexOf('2024-2-30')>=0&&bs.bad.length===0,'broken copy accepts 2024-2-30, so the checker can fail');
  rec(leapTest(isRealDate),'leap: 2024-2-29 accepted, 2023-2-29 rejected');
  rec(leapTest(isRealDateAlwaysLeap)===false&&isRealDateAlwaysLeap('2023-2-29')===true,'always-leap copy fails the leap test');
  rec(monthTest(isRealDate),'months: 31 April and 30 Feb rejected, 30 April and 29 Feb 2024 accepted');
  rec(monthTest(isRealDateBroken)===false,'broken twin fails the month test');
  rec(badTest(isRealDate),'more bad dates ('+badDates.length+' of them) all rejected; 2024-6-30 and 2024-1-31 accepted');
  rec(badTest(isRealDateBroken)===false&&isRealDateBroken('2024-6-31')===true&&isRealDateBroken('2023-11-31')===true,'broken twin fails the bad-dates test (accepts 31 June, 31 November)');
  return {pass:allPass,log:out,n:n};
}
var t=runTests(),b=document.getElementById('banner');
b.className=t.pass?'pass':'fail';
b.textContent=t.pass?'Self-test: all '+t.n+' checks pass (bad dates rejected, leap years right, broken copies caught)':'Self-test FAILED';
document.getElementById('log').textContent=t.log.join('\n');
var lines=[
 '2024-2-30: real sorter '+(isRealDate('2024-2-30')?'accepts (wrong)':'rejects')+'; broken copy '+(isRealDateBroken('2024-2-30')?'accepts (wrong, caught)':'rejects')+'.',
 'Leap years: 2024-2-29 is '+(isRealDate('2024-2-29')?'accepted':'rejected (wrong)')+', 2023-2-29 is '+(isRealDate('2023-2-29')?'accepted (wrong)':'rejected')+'. Always-leap copy accepts 2023-2-29 (wrong, caught).',
 '31 April: real sorter '+(isRealDate('2024-4-31')?'accepts (wrong)':'rejects')+'; broken copy '+(isRealDateBroken('2024-4-31')?'accepts (wrong, caught)':'rejects')+'.',
 'Other bad dates: '+badDates.filter(function(d){return !isRealDate(d);}).length+' of '+badDates.length+' rejected by the real sorter.'
];
document.getElementById('checks').innerHTML=lines.map(function(x){return '<li>'+x+'</li>';}).join('');
function render(){
  var r=sortDates(document.getElementById('in').value.split('\n'),isRealDate);
  document.getElementById('ok').innerHTML=r.ok.map(function(x){return '<li>'+x.replace(/</g,'&lt;')+'</li>';}).join('');
  document.getElementById('bad').innerHTML=r.bad.map(function(x){return '<li class="bad">'+x.replace(/</g,'&lt;')+' (not a real date)</li>';}).join('');
}
document.getElementById('go').addEventListener('click',render);
render();
</script></body></html>
